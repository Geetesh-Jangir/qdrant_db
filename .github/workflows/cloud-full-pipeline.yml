# Portfolio news ingest: Google → Jev → scrape → embed → Qdrant Cloud (append-only).
# Default portfolio: investor_data/mohit/portfolio.json (holdings ≥2%%, sectors ≥3%%, equity filter).
# Does NOT run the RAG app — use Cloud RAG smoke only for /api/ask checks.
#
# Required secrets: QDRANT_URL, QDRANT_API_KEY, JEV_BASE_URL, JEV_API_KEY
# Optional: JEV_MODEL

name: Cloud portfolio news pipeline

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      JEV_MODEL: ${{ secrets.JEV_MODEL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      FRESH_START_EACH_RUN: "false"
      FRESH_START_CLEAR_QDRANT: "false"
      NEWS_CORPUS_MODE: "true"
      PORTFOLIO_JSON: investor_data/mohit/portfolio.json
      ALLISIN_SECTORS_HOLDINGS_JSON: data/fund_holdings_aggregate/portfolio_allisin_holdings.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p data/news_runs data/fund_holdings_aggregate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$QDRANT_URL" || { echo "Missing secret QDRANT_URL"; exit 1; }
          test -n "$QDRANT_API_KEY" || { echo "Missing secret QDRANT_API_KEY"; exit 1; }
          test -n "$JEV_BASE_URL" || { echo "Missing secret JEV_BASE_URL"; exit 1; }
          test -n "$JEV_API_KEY" || { echo "Missing secret JEV_API_KEY"; exit 1; }
          python -c 'from urllib.parse import urlparse; import os; print("Will upsert to Qdrant host:", urlparse(os.environ["QDRANT_URL"]).netloc)'

      - name: Fetch portfolio fund holdings (Rupeestop API)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_portfolio_allisin_subset.py

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Run news pipeline (portfolio universe → Qdrant)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m news_pipeline

      - name: List run outputs (debug)
        if: always()
        run: |
          echo "Contents of data/news_runs:"
          ls -la data/news_runs || true

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-runs
          path: data/news_runs/
          if-no-files-found: warn
