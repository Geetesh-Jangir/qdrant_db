name: Historical news backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive start (D/M/YYYY)"
        required: false
        default: "1/10/2026"
        type: string
      end_date:
        description: "Inclusive end (D/M/YYYY)"
        required: false
        default: "3/10/2026"
        type: string
      holdings_limit:
        description: "Top holdings"
        required: false
        default: "500"
        type: string
      sectors_limit:
        description: "Top sectors"
        required: false
        default: "50"
        type: string
      pause_sec:
        description: "Pause between successful days (seconds)"
        required: false
        default: "600"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      JEV_MODEL: ${{ secrets.JEV_MODEL || 'jev-latest' }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      FRESH_START_EACH_RUN: "false"
      FRESH_START_CLEAR_QDRANT: "false"
      NEWS_CORPUS_MODE: "true"
      RETENTION_DAYS: "0"
      HOLDINGS_LIMIT: ${{ inputs.holdings_limit }}
      SECTORS_LIMIT: ${{ inputs.sectors_limit }}
      BACKFILL_START: ${{ inputs.start_date }}
      BACKFILL_END: ${{ inputs.end_date }}
      BACKFILL_PAUSE_SEC: ${{ inputs.pause_sec }}
      SCRAPE_DOMAIN_GAP_SEC: "0.5"
      SCRAPE_MAX_ATTEMPTS: "3"
      SCRAPE_BACKOFF_BASE_SEC: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare runtime directories
        run: mkdir -p data/news_runs data/news_backfill data/news_failures data/fund_holdings_aggregate data/embedding_models

      - name: Restore backfill checkpoint and failure ledger
        uses: actions/cache@v4
        with:
          path: |
            data/news_backfill
            data/news_failures
          key: news-backfill-${{ inputs.start_date }}-${{ inputs.end_date }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            news-backfill-${{ inputs.start_date }}-${{ inputs.end_date }}-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Validate secrets
        run: |
          test -n "$QDRANT_URL" || { echo "Missing GitHub Secret: QDRANT_URL"; exit 1; }
          test -n "$QDRANT_API_KEY" || { echo "Missing GitHub Secret: QDRANT_API_KEY"; exit 1; }
          test -n "$JEV_BASE_URL" || { echo "Missing GitHub Secret: JEV_BASE_URL"; exit 1; }
          test -n "$JEV_API_KEY" || { echo "Missing GitHub Secret: JEV_API_KEY"; exit 1; }

      - name: Run sequential day backfill
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m news_pipeline.backfill_days

      - name: Summarize per-day run folders
        if: always()
        run: |
          echo "Per-day folders under data/news_runs:"
          find data/news_runs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort || true

      - name: Upload news runs bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-runs-bundle
          path: data/news_runs/
          if-no-files-found: warn

      - name: Upload backfill checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-checkpoint
          path: data/news_backfill/
          if-no-files-found: warn

      - name: Upload failure ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-failure-ledger
          path: data/news_failures/
          if-no-files-found: warn
