# Two modes:
#   rss-only       → scripts/test_google_rss.py only (NO Jev, NO Qdrant upload)
#   full-pipeline  → python -m news_pipeline (Jev + Qdrant Cloud upsert)
#
# To ingest into Qdrant Cloud, use mode "full-pipeline" OR workflow "Cloud full pipeline".

name: Cloud news test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full-pipeline = Jev + Qdrant Cloud. rss-only = Google fetch test only."
        required: true
        default: full-pipeline
        type: choice
        options:
          - rss-only
          - full-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      JEV_MODEL: ${{ secrets.JEV_MODEL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      FRESH_START_EACH_RUN: "false"
      FRESH_START_CLEAR_QDRANT: "false"
      NEWS_CORPUS_MODE: "true"

    steps:
      - name: Selected mode
        run: |
          echo "workflow_mode=${{ inputs.mode }}"
          if [ "${{ inputs.mode }}" = "rss-only" ]; then
            echo "::notice::RSS-only run — Jev and Qdrant are NOT used. Pick full-pipeline to upload to Cloud."
          else
            echo "::notice::Full pipeline — will run Jev, embed, and Qdrant upsert (needs secrets)."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p data/news_runs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Hugging Face models
        if: inputs.mode == 'full-pipeline'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Google RSS test only (no Jev / Qdrant)
        if: inputs.mode == 'rss-only'
        working-directory: ${{ github.workspace }}
        run: python scripts/test_google_rss.py

      - name: Validate secrets for full pipeline
        if: inputs.mode == 'full-pipeline'
        run: |
          test -n "$QDRANT_URL" || { echo "Missing secret QDRANT_URL"; exit 1; }
          test -n "$QDRANT_API_KEY" || { echo "Missing secret QDRANT_API_KEY (required for Qdrant Cloud)"; exit 1; }
          test -n "$JEV_BASE_URL" || { echo "Missing secret JEV_BASE_URL"; exit 1; }
          test -n "$JEV_API_KEY" || { echo "Missing secret JEV_API_KEY"; exit 1; }
          echo "QDRANT target host: $(python -c \"from urllib.parse import urlparse; import os; print(urlparse(os.environ['QDRANT_URL']).netloc)\")"

      - name: Full news pipeline
        if: inputs.mode == 'full-pipeline'
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m news_pipeline

      - name: Verify run log matches mode
        if: always() && (inputs.mode == 'full-pipeline' || inputs.mode == 'rss-only')
        run: |
          set -e
          log="$(ls -t data/news_runs/*.log 2>/dev/null | head -1)"
          test -n "$log" || { echo "No run log under data/news_runs/"; exit 1; }
          echo "Checking $log"
          if [ "${{ inputs.mode }}" = "rss-only" ]; then
            grep -q "google_rss_test started" "$log" || { echo "Expected RSS test log; got:"; head -20 "$log"; exit 1; }
          else
            grep -q "qdrant target" "$log" || { echo "Full pipeline should log qdrant target. Log head:"; head -30 "$log"; exit 1; }
            grep -q "step finished name=jev_title_screen" "$log" || { echo "Full pipeline should run Jev title step. Log tail:"; tail -40 "$log"; exit 1; }
            if grep -q "google_rss_test started" "$log"; then
              echo "Log is from RSS test script, not python -m news_pipeline"
              exit 1
            fi
          fi

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-runs
          path: |
            data/news_runs/*.log
            data/news_runs/*.json
          if-no-files-found: error
